<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit [[${coffee.name}]]</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1 th:text="'Edit ' + ${coffee.name}"></h1>

<div>
    <form th:action="@{/update}" method="post" th:object="${coffee}">
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" required minlength="2" maxlength="50"
                   th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"/>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div>
            <label for="type">Type</label>
            <select id="type" th:field="*{type}" required>
                <option value="">Choose type</option>
                <option value="Arabica">Arabica</option>
                <option value="Robusta">Robusta</option>
            </select>
        </div>

        <div>
            <label for="size">Size</label>
            <select id="size" th:field="*{size}" required>
                <option value="">Choose size</option>
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
            </select>
        </div>

        <div>
            <label for="price">Price</label>
            <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required
                   th:classappend="${#fields.hasErrors('price')} ? 'error' : ''"/>
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div>
            <label for="roastLevel">Roast Level</label>
            <select id="roastLevel" th:field="*{roastLevel}" required>
                <option value="">Choose roast level</option>
                <option value="Light">Light</option>
                <option value="Medium">Medium</option>
                <option value="Dark">Dark</option>
            </select>
        </div>

        <div>
            <label for="origin">Origin</label>
            <input type="text" id="origin" th:field="*{origin}" maxlength="100"/>
        </div>

        <div>
            <label for="decaf">Decaf</label>
            <input type="checkbox" id="decaf" th:field="*{decaf}" value="true"/>
        </div>

        <div>
            <label for="stock">Stock</label>
            <input type="number" id="stock" th:field="*{stock}" min="0" required/>
        </div>

        <div>
            <label>Flavor Notes:</label>
            <label><input type="checkbox" name="flavorNotes" value="Chocolate"
                          th:checked="${#lists.contains(coffee.flavorNotes, 'Chocolate')}"/> Chocolate</label>
            <label><input type="checkbox" name="flavorNotes" value="Citrus"
                          th:checked="${#lists.contains(coffee.flavorNotes, 'Citrus')}"/> Citrus</label>
            <label><input type="checkbox" name="flavorNotes" value="Nutty"
                          th:checked="${#lists.contains(coffee.flavorNotes, 'Nutty')}"/> Nutty</label>
            <label><input type="checkbox" name="flavorNotes" value="Fruity"
                          th:checked="${#lists.contains(coffee.flavorNotes, 'Fruity')}"/> Fruity</label>
        </div>

        <div>
            <label for="brewMethod">Brew Method</label>
            <select id="brewMethod" th:field="*{brewMethod}" required>
                <option value="">Choose brew method</option>
                <option value="Drip">Drip</option>
                <option value="French Press">French Press</option>
                <option value="Espresso">Espresso</option>
            </select>
        </div>

        <div class="action">
            <a th:href="@{/}" class="button cancel">Cancel</a>
            <button type="submit">Update Coffee</button>
        </div>
    </form>
</div>
</body>
</html>
