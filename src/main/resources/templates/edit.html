<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      th:replace="~{layout/main :: html(
          content=~{::main},
          title=~{::title},
          link=~{::link}
)}">
<head>
    <title>Edit Coffee</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<main>
    <div class="container">
        <h1>Edit Coffee</h1>
        <form th:action="@{/update}" th:object="${coffee}" method="post">
            <input type="hidden" th:field="*{id}" />

            <label>Name: <input type="text" th:field="*{name}" /></label><br/>
            <label>Type:
                <select th:field="*{type}">
                    <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
                </select>
            </label><br/>
            <label>Size:
                <select th:field="*{size}">
                    <option th:each="size : ${sizes}" th:value="${size}" th:text="${size}"></option>
                </select>
            </label><br/>
            <label>Price: <input type="number" step="0.01" th:field="*{price}" /></label><br/>
            <label>Roast Level:
                <select th:field="*{roastLevel}">
                    <option th:each="roast : ${roastLevels}" th:value="${roast}" th:text="${roast}"></option>
                </select>
            </label><br/>
            <label>Origin: <input type="text" th:field="*{origin}" /></label><br/>
            <label>Decaf: <input type="checkbox" th:field="*{decaf}" /></label><br/>
            <label>Stock: <input type="number" th:field="*{stock}" /></label><br/>
            <label>Brew Method:
                <select th:field="*{brewMethod}">
                    <option th:each="method : ${brewMethods}" th:value="${method}" th:text="${method}"></option>
                </select>
            </label><br/>
            <label>Flavor Notes (comma-separated): <input type="text" name="flavorNotes" th:value="${coffee.flavorNotes}" /></label><br/>

            <button type="submit">Update Coffee</button>
        </form>
    </div>
</main>
</html>
