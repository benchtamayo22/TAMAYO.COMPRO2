<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="menuItem(url, label, class, activeMenu)">
    <li th:class="'menu-item ' + (${activeMenu} == ${class} ? 'active' : '')" th:attr="data-url=${url}">
        <a th:href="@{${url}}" class="menu-link">
            <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <span class="menu-label" th:text="${label}"></span>
        </a>
    </li>
</th:block>
