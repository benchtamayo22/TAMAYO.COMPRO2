<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Coffee</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div class="form-container">
    <h1>New Coffee</h1>

    <form th:action="@{/save}" th:object="${coffee}" method="post" enctype="multipart/form-data">

        <div class="full">
            <label>Name:</label>
            <input type="text" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div>
            <label>Type:</label>
            <select th:field="*{type}">
                <option value="">-- Please Select --</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}">Type</option>
            </select>
        </div>

        <div>
            <label>Size:</label>
            <select th:field="*{size}">
                <option value="">-- Please Select --</option>
                <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}">Size</option>
            </select>
        </div>

        <div class="full">
            <label>Price:</label>
            <input type="number" step="0.01" th:field="*{price}" />
        </div>

        <div>
            <label>Roast Level:</label>
            <select th:field="*{roastLevel}">
                <option value="">-- Please Select --</option>
                <option th:each="r : ${roastLevels}" th:value="${r}" th:text="${r}">Roast Level</option>
            </select>
        </div>

        <div>
            <label>Origin:</label>
            <input type="text" th:field="*{origin}" />
        </div>

        <div>
            <label>Decaf:</label>
            <select th:field="*{decaf}">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>

        <div>
            <label>Stock:</label>
            <input type="number" th:field="*{stock}" />
        </div>

        <div class="full">
            <label>Flavor Notes:</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Chocolate"/> Chocolate</label>
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Mint"/> Mint</label>
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Herbal"/> Herbal</label>
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Roasted"/> Roasted</label>
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Caramel"/> Caramel</label>
                <label class="checkbox-item"><input type="checkbox" th:field="*{flavorNotesList}" value="Nutty"/> Nutty</label>
            </div>
        </div>

        <div class="full">
            <label>Brew Method:</label>
            <select th:field="*{brewMethod}">
                <option value="">-- Please Select --</option>
                <option th:each="b : ${brewMethods}" th:value="${b}" th:text="${b}">Brew Method</option>
            </select>
        </div>

        <div class="full">
            <label>Image Upload:</label>
            <input type="file" name="imageFile" />
        </div>

        <div class="action">
            <button type="submit">Save</button>
            <a class="button" th:href="@{/}">Back to List</a>
        </div>

    </form>
</div>

</body>
</html>
