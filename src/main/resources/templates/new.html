<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{style.css}">
    <title>New Coffee</title>
</head>
<body>
<h1>New Coffee</h1>
<div>
    <form action="/save" method="POST">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required minlength="2" maxlength="50"/>
        </div>

        <div class="form-group">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="">Choose type</option>
                <option value="Arabica">Arabica</option>
                <option value="Robusta">Robusta</option>
            </select>
        </div>

        <div class="form-group">
            <label for="size">Size:</label>
            <select id="size" name="size" required>
                <option value="">Choose size</option>
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
            </select>
        </div>

        <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" id="price" name="price" required min="0.01" step="0.01"/>
        </div>

        <div class="form-group">
            <label for="roastLevel">Roast Level:</label>
            <select id="roastLevel" name="roastLevel" required>
                <option value="">Choose roast level</option>
                <option value="Light">Light</option>
                <option value="Medium">Medium</option>
                <option value="Dark">Dark</option>
            </select>
        </div>

        <div class="form-group">
            <label for="origin">Origin:</label>
            <input type="text" id="origin" name="origin" maxlength="100"/>
        </div>

        <div class="form-group">
            <label>Decaf:</label>
            <input type="hidden" name="isDecaf" value="false"/>
            <input type="checkbox" id="isDecaf" name="isDecaf" value="true"/>
        </div>

        <div class="form-group">
            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" required min="0"/>
        </div>

        <div class="form-group">
            <label>Flavor Notes:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="flavorNotes" value="Chocolate"> Chocolate</label>
                <label><input type="checkbox" name="flavorNotes" value="Citrus"> Citrus</label>
                <label><input type="checkbox" name="flavorNotes" value="Nutty"> Nutty</label>
                <label><input type="checkbox" name="flavorNotes" value="Fruity"> Fruity</label>
            </div>
        </div>

        <div class="form-group">
            <label for="brewMethod">Brew Method:</label>
            <select id="brewMethod" name="brewMethod" required>
                <option value="">Choose brew method</option>
                <option value="Drip">Drip</option>
                <option value="French Press">French Press</option>
                <option value="Espresso">Espresso</option>
            </select>
        </div>

<button type="submit">Add Coffee</button>

<button type="button" onclick="location.href='/'">Back to List</button>

</form>
</div>
</body>
</html>
