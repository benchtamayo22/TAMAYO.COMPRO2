<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
      th:replace="~{layout/main :: html(
          title=~{::title},
          link=~{::link},
          content=~{::main}
      )}">
<head>
    <title th:fragment="title">Coffee</title>
    <link th:fragment="link" rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main th:fragment="main">
    <!-- Top Bar with Heading and Search -->
    <div class="top-bar">
        <h1>Starbucks Coffee List</h1>
        <form th:action="@{/}" method="get">
            <input type="text" name="search" placeholder="Search..." />
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Table Section -->
    <div class="table-container">
        <h2 style="margin-bottom: 1rem; color: #1e3932;">Available Starbucks Coffees</h2>
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Price</th>
                <th>Roast Level</th>
                <th>Origin</th>
                <th>Decaf</th>
                <th>Stock</th>
                <th>Flavor Notes</th>
                <th>Brew Method</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="coffee, stat : ${coffees}">
                <td th:text="${stat.count}"></td>
                <td th:text="${coffee.name}"></td>
                <td th:text="${coffee.type}"></td>
                <td th:text="${coffee.size}"></td>
                <td th:text="'$' + ${coffee.price}"></td>
                <td th:text="${coffee.roastLevel}"></td>
                <td th:text="${coffee.origin}"></td>
                <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
                <td th:text="${coffee.stock}"></td>
                <td th:text="${coffee.flavorNotes != null ? #strings.arrayJoin(coffee.flavorNotes, ', ') : 'No flavor notes'}"></td>
                <td th:text="${coffee.brewMethod}"></td>
                <td>
                    <a th:href="@{/coffee/{id}(id=${coffee.id})}">View</a>
                    <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
                    <a th:href="@{/delete(id=${coffee.id})}">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
